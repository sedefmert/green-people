<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title description">
  <title id="title">GreenWarriors experiment connection diagram</title>
  <desc id="description">The Raspberry Pi 4 sends data through an access point and laptop relay to the gl2 TCP sink. A Shelly Plus Plug S measures the AC power supplied to the Pi.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #000; }
      .section { font: 700 15px Arial, sans-serif; fill: #000; letter-spacing: .4px; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #000; }
      .node-text { font: 15px Arial, sans-serif; fill: #000; }
      .label { font: 14px Arial, sans-serif; fill: #000; }
      .note { font: 14px Arial, sans-serif; fill: #000; }
    </style>
  </defs>

  <rect width="1200" height="450" fill="#fff"/>
  <g transform="translate(0,-55)">

  <text class="section" x="55" y="105">DATA PATH</text>
  <rect x="55" y="130" width="210" height="105" fill="#fff" stroke="#000" stroke-width="2"/>
  <text class="node-title" x="74" y="163">Raspberry Pi 4</text>
  <text class="node-text" x="74" y="190">Compression + sampler</text>

  <rect x="350" y="130" width="190" height="105" fill="#fff" stroke="#000" stroke-width="2"/>
  <text class="node-title" x="369" y="163">Access point</text>
  <text class="node-text" x="369" y="190">Dedicated 5 GHz Wi-Fi</text>

  <rect x="625" y="130" width="230" height="105" fill="#fff" stroke="#000" stroke-width="2"/>
  <text class="node-title" x="644" y="163">Team laptop</text>
  <text class="node-text" x="644" y="190">TCP relay: port 5001</text>

  <rect x="940" y="130" width="205" height="105" fill="#fff" stroke="#000" stroke-width="2"/>
  <text class="node-title" x="959" y="163">gl2</text>
  <text class="node-text" x="959" y="190">TCP sink: port 5000</text>

  <line x1="266" y1="182" x2="349" y2="182" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="541" y1="182" x2="624" y2="182" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="856" y1="182" x2="939" y2="182" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="label" x="286" y="119">Wi-Fi</text>
  <text class="label" x="561" y="119">Ethernet</text>
  <text class="label" x="863" y="119">SSH tunnel</text>

  <text class="section" x="55" y="302">PI POWER MEASUREMENT</text>
  <rect x="55" y="327" width="180" height="92" fill="#fff" stroke="#000" stroke-width="2"/>
  <text class="node-title" x="74" y="361">Wall socket</text>
  <text class="node-text" x="74" y="387">AC supply</text>

  <rect x="330" y="327" width="235" height="92" fill="#fff" stroke="#000" stroke-width="2"/>
  <text class="node-title" x="349" y="361">Shelly Plus Plug S</text>
  <text class="node-text" x="349" y="387">Primary power meter</text>

  <rect x="660" y="327" width="210" height="92" fill="#fff" stroke="#000" stroke-width="2"/>
  <text class="node-title" x="679" y="361">Pi USB-C supply</text>
  <text class="node-text" x="679" y="387">Official power supply</text>

  <line x1="236" y1="373" x2="329" y2="373" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="566" y1="373" x2="659" y2="373" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 871 373 L 900 373 L 900 270 L 160 270 L 160 236" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="label" x="251" y="351">power</text>
  <text class="label" x="581" y="351">power</text>

  <path d="M 740 236 L 740 286 L 448 286 L 448 326" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text class="label" x="502" y="278">Shelly HTTP polling</text>
  </g>
</svg>
